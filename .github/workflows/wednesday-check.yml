name: 野薯周三体检(V2-b)

on:
  schedule:
    # UTC 12:00 = 北京周三 20:00(spec §11.4)
    - cron: "0 12 * * 3"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 拉数据 + 分析周三体检 + 构造卡片 + 推送飞书
        env:
          # GH_PAT = 用户的 Classic PAT(scope: project + repo),不能用 Actions 自带 GITHUB_TOKEN(无 project scope)
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_LOGIN: ${{ secrets.YESHU_LOGIN }}
          GITHUB_PROJECT_NUMBER: ${{ secrets.YESHU_PROJECT_NUMBER }}
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_OPEN_ID: ${{ secrets.LARK_OPEN_ID }}
        run: |
          python scripts/fetch_data.py > /tmp/items.json
          echo "项目卡片数:$(python -c 'import json;print(len(json.load(open("/tmp/items.json"))))')"
          python scripts/analyze.py --mode wednesday < /tmp/items.json > /tmp/analysis.json
          python scripts/build_card.py --mode wednesday < /tmp/analysis.json > /tmp/card.json
          python scripts/push_lark.py < /tmp/card.json
