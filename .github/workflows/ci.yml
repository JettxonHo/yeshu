name: CI

# PR 门禁 + main 推送检查。只读检查与构建:不读生产 Secret,不部署。
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    name: worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 与 esbuild target=node20 / @types/node 20 / 阿里云 FC runtime nodejs20 对齐
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      # 生产依赖安全门禁:moderate 及以上即失败(硬性要求 critical=0 / high=0,目标 moderate=0)。
      # audit 固定查询官方 registry(部分镜像未实现 security 端点);不接受 --force / 忽略退出码。
      - run: npm run security:audit
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # 与 daily-push.yml 的 Python 版本保持一致
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      # unittest 与 py_compile 均只使用 mock/本地代码,不发起真实 API 请求。
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python -m py_compile scripts/*.py
